server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    root __APP_ROOT__/frontend/dist;
    index index.html;
    client_max_body_size 2m;
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;

    location = /config.json {
        alias __APP_ROOT__/frontend/dist/config.json;
        default_type application/json;
        add_header Cache-Control "no-store";
    }

    location = /runtime-config.json {
        alias /etc/esports-site-selection/frontend-runtime.json;
        default_type application/json;
        add_header Cache-Control "no-store";
    }

    location /assets/ {
        try_files $uri =404;
        access_log off;
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 120s;
    }

    location = /nginx-health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location ~ /\.(?!well-known) {
        return 404;
    }

    location ~* /(vendor|node_modules|backend|deploy|scripts|docs|\.git)/ {
        return 404;
    }

    location / {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        try_files $uri $uri/ /index.html;
    }
}
